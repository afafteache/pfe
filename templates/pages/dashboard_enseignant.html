{% extends "layouts/base.html" %}

{% block title %}Dashboard Enseignant{% endblock %}

{% block content %}

<div class="container-fluid py-4">

  <div class="row">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm">Mes QCM</p>
          <h4>{{ total_qcm }}</h4>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm">Candidats évalués</p>
          <h4>{{ total_candidats }}</h4>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm">Moyenne Générale</p>
          <h4>{{ moyenne }}</h4>
        </div>
      </div>
    </div>
  </div>

</div>

{% endblock %}
