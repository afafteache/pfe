{% extends "base.html" %}

{% block title %}Session d'Examen{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10">
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Examen de QCM</h4>
                <div class="badge badge-danger p-3" style="font-size: 1.5rem;">
                    Temps restant : <span id="timer">30:00</span>
                </div>
            </div>
            
            <div class="card-body">
                <div class="progress mb-4" style="height: 10px;">
                    <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 10%;"></div>
                </div>

                <form id="examen-form" method="POST" action="/soumettre_examen">
                    <div class="question-block p-4 border rounded bg-light mb-3">
                        <h5><strong>Question 1 :</strong> Quelle est la syntaxe correcte pour une route en Flask ?</h5>
                        <hr>
                        <div class="options-list mt-3">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q1" id="q1a" value="A" onclick="sauvegarderReponse(1, 'A')">
                                <label class="form-check-label" for="q1a">@app.route('/')</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="q1" id="q1b" value="B" onclick="sauvegarderReponse(1, 'B')">
                                <label class="form-check-label" for="q1b">@flask.path('/')</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card-footer d-flex justify-content-between">
                <button type="button" class="btn btn-secondary shadow-sm">Précédent</button>
                <button type="submit" form="examen-form" class="btn btn-primary shadow-sm">Terminer l'examen</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
